<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" id="first" placeholder="First Number">
    <input type="number" id="second" placeholder="Second Number">
    <br>
    <br>
    <div>
        <button onclick="Calculate('sum')">Add</button>
        <button onclick="Calculate('sub')">Sub</button>
        <button onclick="Calculate('mul')">Mul</button>
        <button onclick="Calculate('div')">Div</button>
    </div>
    <br>
    <div>
        <div id="response"> </div> 
    </div>
    <script>
        async function Calculate(Operations) {
            
        
     const a  =  document.getElementById("first").value;
     const b  =  document.getElementById("second").value;
     const res = await fetch(`http://localhost:3002/sum/`,{
        method : "POST" , 
        headers:{
            "Content-type": "application/json"
        },
        body: JSON.stringify({
            a : a,
            b : b
        })

     }) // sending an Http request to the server 
     const json = await res.json(); // getting the response in the raw form so again await it to get the json 
     document.getElementById("response").innerHTML = json.ans;  // having the ans 
        }
    </script>
</body>
</html>
